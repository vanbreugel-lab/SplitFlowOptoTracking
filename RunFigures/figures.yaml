    title: Example real fly trajectories
    script: supp_extra_real_trajectories.sh
    # notebook writes: FigureGeneration/Supplemental/supp_fig_04_real_trajectories/combined_real_trajectories.svg
    svg: FigureGeneration/Supplemental/supp_fig_04_real_trajectories/output_figs/combined_real_trajectories.svg

  - id: supp_synthetic_trajectories
    name: Figure_S5
    title: Example synthetic trajectories
    script: supp_synthetic_trajectories.sh
    # regenerated by the notebook, finished layout included (hand-finished copy: output_figs/combined_synthetic_trajectories.svg)
    svg: FigureGeneration/Supplemental/supp_fig_05_synthetic_trajectories/combined_synthetic_trajectories.svg

  - id: supp_pca_rf_classifier
    name: Figure_S6
    title: Random forest on the first k principal components (k = 2-10)
    script: supp_pca_rf_classifier.sh
    # written by the script, finishing included (former hand-finished copy: previous version in git history)
    svg: FigureGeneration/Supplemental/supp_fig_06_pca_rf_classifier/output_figs/supplemental_pca_2_to_10_rf.svg

  - id: supp_reconstruction
    name: Figure_S7
    title: Autoencoder reconstructions and reconstruction error, real vs synthetic
