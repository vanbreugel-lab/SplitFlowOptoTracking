# Final SVG for each manuscript figure.
#
#   name:   file name used in FinalFigures/{svgs,pdfs,pngs}/ (no extension)
#   script: RunFigures/ script that regenerates the figure
#   svg:    path to the finished SVG, relative to the repository root
#
# collect_final_figures.sh reads this file (the `main` and `supplemental` lists).
# Supplemental figures are listed in SI order; their folders are numbered to
# match (FigureGeneration/Supplemental/supp_fig_NN_*). To renumber, rename the
# folder and edit `name`. `unused` lists figure folders that are no longer in
# the SI; collect_final_figures.sh skips them.
#
# Where a figure's notebooks write somewhere other than `svg`, the path they
# write is given in a comment ("notebook writes: ..."). Those figures currently
# point at the committed copy in output_figs/.

main:
  - id: fig1
    name: Figure_1
    title: Unifying-algorithm math
    script: fig1.sh
    svg: FigureGeneration/Main/fig_1_math_figure/unifying_math_v4.svg

  - id: fig2
    name: Figure_2
    title: Wind tunnel and CFD
    script: fig2.sh
    # fig2.sh regenerates fig2_tunnel_methods.svg from fig2_template.svg; the finished (hand-edited) figure is
    # output_figs/fig2_tunnel_methods.svg
    svg: FigureGeneration/Main/fig_2_wind_tunnel_CFD/output_figs/fig2_tunnel_methods.svg

  - id: fig3
    name: Figure_3
    title: Trajectory characteristics
    script: fig3.sh
    # regenerated by fig3.sh from f3_template.svg
    svg: FigureGeneration/Main/fig_3_trajectory_characteristics/f3_raw_data.svg

  - id: fig4
    name: Figure_4
    title: Autoencoder
    script: fig4.sh
    # written by make_f4.py from f4_template.svg, finishing included (the former hand-finished copy is this
    #   file's previous version in git history)
    svg: FigureGeneration/Main/fig_4_autoencoder/output_figs/f4_autoencoder.svg

  - id: fig5
    name: Figure_5
    title: Unifying-algorithm analysis
    script: fig5.sh
    svg: FigureGeneration/Main/fig_5_unifying_algo_analysis/generate_figure_5/unifying_analysis_translationTrue.svg

supplemental:
  - id: supp_tunnel_methods
    name: Figure_S1
    title: Additional wind tunnel / CFD analysis
    script: supp_tunnel_methods.sh
    # regenerated by supp_tunnel_methods.sh from tunnel_methods_supplement_template.svg
    #   (published copy: output_figs/tunnel_methods_supplement.svg)
    svg: FigureGeneration/Supplemental/supp_fig_01_tunnel_methods/tunnel_methods_supplement.svg

  - id: supp_course_direction
    name: Figure_S2
    title: Course direction responses
    script: supp_course_direction.sh
    svg: FigureGeneration/Supplemental/supp_fig_02_course_direction_response/supp_course_direction.svg

  - id: supp_altitude_response
