    title: Altitude responses
    script: supp_altitude_response.sh
    # regenerated by supp_altitude_response.sh from supp_altitude_template.svg
    #   (published copy: output_figs/supp_altitude.svg)
    svg: FigureGeneration/Supplemental/supp_fig_03_altitude_response/supp_altitude.svg

  - id: supp_extra_real_trajectories
